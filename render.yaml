services:
  - type: web
    name: ashley-comp229-portfolio
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci --include=dev && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
